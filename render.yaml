# Render Blueprint: deploys the whole repo as two services.
#   marketmind-api  -> FastAPI backend (Docker, backend/)
#   marketmind-web  -> Next.js frontend (Node, repo root)
services:
  - type: web
    name: marketmind-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MARKET_DATA_MODE
        value: live
      # Frontend URL(s), comma separated, e.g. https://marketmind-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: NEWS_API_KEY
        sync: false
      # AI Mentor (Groq). Set the value in the Render dashboard, never in git.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  - type: web
    name: marketmind-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Backend URL, e.g. https://marketmind-api.onrender.com (read at build time)
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyB3Nyz8ZH9AYWr28rpk_oLmHsX3cWo9Otw
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: studio-3049477614-ce440.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: studio-3049477614-ce440
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: studio-3049477614-ce440.firebasestorage.app
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "486617441293"
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: "1:486617441293:web:b2b41c1803c7ca2e63e144"
      - key: AUTH_SECRET
        generateValue: true
