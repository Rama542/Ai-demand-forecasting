# Render Blueprint: deploys the whole repo as two services.
#   marketmind-api  -> FastAPI backend (Docker, backend/)
#   marketmind-web  -> Next.js frontend (Node, repo root)
services:
  - type: web
    name: marketmind-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MARKET_DATA_MODE
        value: live
      # Frontend URL(s), comma separated, e.g. https://marketmind-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: NEWS_API_KEY
        sync: false

  - type: web
    name: marketmind-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /dashboard
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Backend URL, e.g. https://marketmind-api.onrender.com (read at build time)
      - key: NEXT_PUBLIC_API_URL
        sync: false
